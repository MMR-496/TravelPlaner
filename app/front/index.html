<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Planer</title>
<!--
  Front de Travel Planer. Una sola página que usa la API desde el navegador.

  Cómo abrirla (Windows, cmd):
     cd front
     python -m http.server 5500
  y en el navegador:  http://127.0.0.1:5500
  No la abran con doble clic: el origen sería "null" y la API no lo tiene en su lista de CORS.

  Qué hace:
   - Login (coco, pancho...) y muestra con qué rol entraste.
   - Viajes: ver, crear, editar (PATCH) y borrar. Crear/editar/borrar solo el encargado.
   - Actividades de un viaje: ver, crear, editar (PATCH) y borrar.
   - Sugerencia de la IA para un destino.
-->
<style>
:root{--bg:#F3F5F9;--panel:#fff;--ink:#141C2B;--soft:#4F5A6B;--line:#DCE2EB;--blue:#2E5BE6;--blue-t:#E8EEFD;
  --teal:#0C6259;--teal-t:#E2F5F2;--amber:#7A4E0E;--amber-t:#FCF0DC;--red:#9C3422;--red-t:#FBE9E6;
  --mono:Consolas,Menlo,monospace;--sans:'Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
header .info{font-family:var(--mono);font-size:13px;opacity:.85;overflow-wrap:anywhere}
header button{background:transparent;border:1px solid #fff6;color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h2{font-size:17px;margin:0 0 10px}
.ancho{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin-top:8px}
input,select,textarea{display:block;width:100%;margin-top:3px;border:1px solid #C9D1DD;border-radius:9px;padding:8px 10px;background:#fff}
input.mal,select.mal,textarea.mal{border-color:var(--red);background:var(--red-t)}
.err-campo{color:var(--red);font-size:13px;margin-top:3px}
.btn{margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.gris{background:#fff;color:var(--ink);border:1px solid #C9D1DD}
.btn:disabled{opacity:.55;cursor:wait}
.chico{margin:0 4px 0 0;padding:4px 10px;font-size:13px;border-radius:8px;border:1px solid #C9D1DD;background:#fff;color:var(--ink);cursor:pointer;font-weight:600}
.chico.peligro{color:var(--red);border-color:var(--red)}
.msg{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:14.5px}
.msg.ok{background:var(--teal-t);color:var(--teal)}
.msg.aviso{background:var(--amber-t);color:var(--amber)}
.msg.mal{background:var(--red-t);color:var(--red)}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--soft)}
.rueda{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
.chips span{display:inline-block;background:var(--blue-t);color:#1F3FA8;border-radius:999px;padding:3px 10px;margin:3px 4px 0 0;font-size:14px}
#registro{font-family:var(--mono);font-size:12.5px;line-height:1.6;max-height:180px;overflow:auto;margin:0;white-space:pre-wrap}
.oculto{display:none}
@media (max-width:760px){main{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rueda{animation:none}}
</style>
</head>
<body>

<header>
  <h1>Travel Planer</h1>
  <span class="info" id="info"></span>
  <span><span class="info" id="quien">sin sesión</span> <button id="salir" class="oculto" type="button">Salir</button></span>
</header>

<main>

  <!-- ENTRAR -->
  <section class="card" id="cLogin">
    <h2>Entrar</h2>
    <form id="fLogin">
      <label for="l_usuario">Usuario</label>
      <input id="l_usuario" autocomplete="username">
      <label for="l_clave">Clave</label>
      <input id="l_clave" type="password" autocomplete="current-password">
      <button class="btn">Entrar</button>
      <div id="lMsg"></div>
    </form>
  </section>

  <!-- VIAJE: sirve para crear y para editar (solo el encargado) -->
  <section class="card oculto" id="cViaje">
    <h2 id="tViaje">Nuevo viaje</h2>
    <form id="fViaje">
      <label for="v_personas">Personas</label>
      <input id="v_personas" type="number" placeholder="2">
      <div class="err-campo" id="e_v_personas"></div>

      <label for="v_destino">Destino</label>
      <input id="v_destino" placeholder="Guadalajara">
      <div class="err-campo" id="e_v_destino"></div>

      <label for="v_presupuesto">Presupuesto</label>
      <input id="v_presupuesto" type="number" step="any" placeholder="1500.50">
      <div class="err-campo" id="e_v_presupuesto"></div>

      <label for="v_fecha_salida">Fecha de salida</label>
      <input id="v_fecha_salida" type="date">
      <div class="err-campo" id="e_v_fecha_salida"></div>

      <label for="v_fecha_regreso">Fecha de regreso</label>
      <input id="v_fecha_regreso" type="date">
      <div class="err-campo" id="e_v_fecha_regreso"></div>

      <label for="v_estado">Estado</label>
      <select id="v_estado">
        <option value="pendiente">pendiente</option>
        <option value="en curso">en curso</option>
        <option value="completado">completado</option>
      </select>
      <div class="err-campo" id="e_v_estado"></div>

      <button class="btn" id="vGuardar">Guardar viaje</button>
      <button class="btn gris oculto" id="vCancelar" type="button">Cancelar edición</button>
      <div id="vMsg"></div>
    </form>
  </section>

  <!-- IA -->
  <section class="card oculto" id="cIA">
    <h2>Pregúntale a la IA</h2>
    <form id="fIA">
      <label for="iaTexto">Destino</label>
      <textarea id="iaTexto" rows="3" placeholder="Comala, Colima"></textarea>
      <button class="btn" id="iaBtn">Pedir sugerencia</button>
      <div id="iaRes"></div>
    </form>
  </section>

  <!-- LISTA DE VIAJES -->
  <section class="card ancho oculto" id="cViajes">
    <h2>Viajes</h2>
    <div id="listaViajes" class="tabla"></div>
    <div id="viajesMsg"></div>
    <button class="btn" id="recargar" type="button">Volver a cargar</button>
  </section>

  <!-- ACTIVIDADES del viaje elegido -->
  <section class="card ancho oculto" id="cActividades">
    <h2 id="tActividades">Actividades</h2>
    <form id="fActividad">
      <label for="a_nombre">Nombre</label>
      <input id="a_nombre" placeholder="Visitar la playa">
      <div class="err-campo" id="e_a_nombre"></div>

      <label for="a_hora">Hora</label>
      <input id="a_hora" type="time">
      <div class="err-campo" id="e_a_hora"></div>

      <button class="btn" id="aGuardar">Guardar actividad</button>
      <button class="btn gris oculto" id="aCancelar" type="button">Cancelar edición</button>
      <div id="aMsg"></div>
    </form>
    <div id="listaActividades" class="tabla"></div>
  </section>

  <!-- REGISTRO -->
  <section class="card ancho">
    <h2>Lo que la página le pidió a la API <span style="font-weight:400;color:var(--soft);font-size:13px">(lo mismo lo ven en F12, pestaña Red)</span></h2>
    <pre id="registro"></pre>
  </section>

</main>

<script>
"use strict";

// ============================================================
// 1. DATOS DE LA PÁGINA
// ============================================================

const API = "http://127.0.0.1:8000";            // la dirección de la API

const CAMPOS_VIAJE = ["personas", "destino", "presupuesto", "fecha_salida", "fecha_regreso", "estado"];
const NUMEROS_VIAJE = ["personas", "presupuesto"];
const CAMPOS_ACTIVIDAD = ["nombre", "hora"];

let TOKEN = null;                  // el token que nos da el login
let USUARIO = "";                  // quién entró
let ROL = "";                      // encargado o invitado

let VIAJES = [];                   // los viajes que se están mostrando
let ACTIVIDADES = [];              // las actividades que se están mostrando
let VIAJE_ACTUAL = null;           // id del viaje cuyas actividades se ven
let VIAJE_EDITANDO = null;         // el viaje que se está editando (null = estamos creando)
let ACTIVIDAD_EDITANDO = null;     // la actividad que se está editando (null = estamos creando)

try {
  TOKEN = sessionStorage.getItem("token_viajes");
} catch (e) {
  TOKEN = null;
}

function $(selector) {
  return document.querySelector(selector);
}

// Evita que un texto con < o > se interprete como HTML
function esc(texto) {
  const mapa = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  let resultado = "";
  const cadena = String(texto === null || texto === undefined ? "" : texto);
  for (const letra of cadena) {
    if (mapa[letra]) {
      resultado += mapa[letra];
    } else {
      resultado += letra;
    }
  }
  return resultado;
}

function anotar(linea) {
  const registro = $("#registro");
  registro.textContent = new Date().toLocaleTimeString() + "  " + linea + "\n" + registro.textContent;
}

// ============================================================
// 2. HABLAR CON LA API
// ============================================================

// Una sola función para todas las peticiones. El token viaja en CADA una.
async function pedir(metodo, ruta, cuerpo) {
  const encabezados = { "Accept": "application/json" };
  if (cuerpo !== undefined) {
    encabezados["Content-Type"] = "application/json";
  }
  if (TOKEN) {
    encabezados["Authorization"] = "Bearer " + TOKEN;
  }

  const inicio = performance.now();
  let respuesta;
  try {
    respuesta = await fetch(API + ruta, {
      method: metodo,
      headers: encabezados,
      body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
    });
  } catch (e) {
    // fetch solo falla si no hubo respuesta que la página pueda leer: API apagada o CORS
    anotar(metodo + " " + ruta + " → sin respuesta (¿API apagada? ¿CORS? Abre F12, pestaña Consola)");
    return { codigo: 0, datos: null };
  }

  const texto = await respuesta.text();
  let datos = null;
  if (texto !== "") {
    try {
      datos = JSON.parse(texto);
    } catch (e) {
      datos = { error: texto.slice(0, 200) };
    }
  }
  const milisegundos = Math.round(performance.now() - inicio);
  anotar(metodo + " " + ruta + " → " + respuesta.status + " (" + milisegundos + " ms)");
  return { codigo: respuesta.status, datos: datos };
}

// ============================================================
// 3. QUÉ HACE LA PÁGINA CON CADA CÓDIGO
// ============================================================

// Regresa [tipo, texto] para mostrar en un mensaje
function explicar(codigo, datos) {
  let texto = "";
  if (datos && typeof datos.error === "string") {
    texto = datos.error;
  }

  if (codigo === 0) {
    return ["mal", "No se pudo hablar con la API. ¿Está corriendo? Si sí, es CORS: abre F12, pestaña Consola."];
  }
  if (codigo === 401) {
    cerrarSesion();
    return ["aviso", "Tu sesión no es válida o expiró. Entra otra vez."];
  }
  if (codigo === 403) {
    return ["aviso", "Tu usuario no tiene permiso para esto."];
  }
  if (codigo === 404) {
    return ["aviso", texto || "No existe."];
  }
  if (codigo === 409) {
    return ["aviso", texto || "Choca con algo que ya existe."];
  }
  if (codigo === 400 || codigo === 422) {
    return ["aviso", texto || "Revisa los datos."];
  }
  if (codigo === 502 || codigo === 503 || codigo === 504) {
    return ["aviso", (texto || "El servicio externo no respondió.") + " (no es tu culpa: intenta en un momento)"];
  }
  if (codigo >= 500) {
    return ["mal", "Error de la API (" + codigo + "). Revisa la ventana donde corre la API."];
  }
  return ["ok", texto];
}

function mensaje(elemento, tipo, texto) {
  if (texto) {
    elemento.innerHTML = '<div class="msg ' + tipo + '">' + esc(texto) + "</div>";
  } else {
    elemento.innerHTML = "";
  }
}

// La API manda los errores así: {"detalles": ["campo: mensaje", ...]}
// Esto lo convierte en {campo: mensaje}
function erroresPorCampo(datos) {
  const resultado = {};
  if (!datos || !Array.isArray(datos.detalles)) {
    return resultado;
  }
  for (const detalle of datos.detalles) {
    const texto = String(detalle);
    const posicion = texto.indexOf(":");
    if (posicion > 0) {
      const campo = texto.slice(0, posicion).trim();
      resultado[campo] = texto.slice(posicion + 1).trim();
    }
  }
  return resultado;
}

// ============================================================
// 4. FORMULARIOS: leer, limpiar y marcar errores
//    prefijo "v" = viaje, prefijo "a" = actividad
// ============================================================

// Lee los campos del formulario. Los números se convierten a número.
function leerCampos(prefijo, campos, numeros) {
  const valores = {};
  for (const campo of campos) {
    const texto = $("#" + prefijo + "_" + campo).value;
    if (numeros.includes(campo) && texto !== "") {
      valores[campo] = Number(texto);
    } else {
      valores[campo] = texto;
    }
  }
  return valores;
}

function limpiarErrores(prefijo, campos) {
  for (const campo of campos) {
    $("#" + prefijo + "_" + campo).classList.remove("mal");
    $("#e_" + prefijo + "_" + campo).textContent = "";
  }
}

// Marca en rojo cada campo que la API dijo que está mal
function marcarErrores(prefijo, datos) {
  const porCampo = erroresPorCampo(datos);
  for (const campo in porCampo) {
    const entrada = $("#" + prefijo + "_" + campo);
    if (entrada) {
      entrada.classList.add("mal");
      $("#e_" + prefijo + "_" + campo).textContent = porCampo[campo];
    }
  }
}

// Para un PATCH: de todos los valores del formulario, solo los que cambiaron
function soloCambios(valores, original) {
  const cambios = {};
  for (const campo in valores) {
    const nuevo = valores[campo];
    if (nuevo !== "" && String(nuevo) !== String(original[campo])) {
      cambios[campo] = nuevo;
    }
  }
  return cambios;
}

// ============================================================
// 5. SESIÓN
// ============================================================

function pintarSesion() {
  const haySesion = TOKEN !== null;
  const esEncargado = haySesion && ROL === "encargado";

  $("#cLogin").classList.toggle("oculto", haySesion);
  $("#cViaje").classList.toggle("oculto", !esEncargado);      // crear y editar: solo el encargado
  $("#cIA").classList.toggle("oculto", !haySesion);
  $("#cViajes").classList.toggle("oculto", !haySesion);
  $("#cActividades").classList.toggle("oculto", !haySesion || VIAJE_ACTUAL === null);
  $("#salir").classList.toggle("oculto", !haySesion);

  if (haySesion) {
    $("#quien").textContent = USUARIO + " (" + ROL + ")";
  } else {
    $("#quien").textContent = "sin sesión";
  }
}

function cerrarSesion() {
  TOKEN = null;
  USUARIO = "";
  ROL = "";
  VIAJE_ACTUAL = null;
  VIAJES = [];
  ACTIVIDADES = [];
  try {
    sessionStorage.removeItem("token_viajes");
  } catch (e) {
    // no pasa nada si el navegador no deja guardar
  }
  pintarSesion();
}

// Le pregunta a la API quién es el dueño del token
async function cargarYo() {
  const { codigo, datos } = await pedir("GET", "/yo");
  if (codigo === 200 && datos) {
    USUARIO = datos.usuario;
    ROL = datos.rol;
  } else {
    cerrarSesion();
  }
}

$("#fLogin").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const cuerpo = { usuario: $("#l_usuario").value, clave: $("#l_clave").value };

  const boton = ev.target.querySelector("button");
  boton.disabled = true;
  const { codigo, datos } = await pedir("POST", "/login", cuerpo);
  boton.disabled = false;

  if (codigo === 200 && datos && datos.access_token) {
    TOKEN = datos.access_token;
    try {
      sessionStorage.setItem("token_viajes", TOKEN);
    } catch (e) {
      // no pasa nada si el navegador no deja guardar
    }
    $("#l_clave").value = "";
    mensaje($("#lMsg"), "", "");
    await cargarYo();
    pintarSesion();
    cargarViajes();
  } else if (codigo === 401) {
    mensaje($("#lMsg"), "mal", "Usuario o clave incorrectos.");
  } else {
    const [tipo, texto] = explicar(codigo, datos);
    mensaje($("#lMsg"), tipo, texto);
  }
});

$("#salir").addEventListener("click", () => {
  cerrarSesion();
});

// ============================================================
// 6. VIAJES
// ============================================================

async function cargarViajes() {
  $("#listaViajes").innerHTML = '<span class="rueda"></span>Cargando…';
  const { codigo, datos } = await pedir("GET", "/viajes");

  if (codigo !== 200 || !Array.isArray(datos)) {
    const [tipo, texto] = explicar(codigo, datos);
    $("#listaViajes").innerHTML = "";
    mensaje($("#viajesMsg"), tipo, texto);
    return;
  }

  mensaje($("#viajesMsg"), "", "");
  VIAJES = datos;
  if (VIAJES.length === 0) {
    $("#listaViajes").innerHTML = "<p>No hay viajes todavía.</p>";
    return;
  }

  let html = "<table><tr><th>id</th><th>destino</th><th>personas</th><th>presupuesto</th>" +
             "<th>salida</th><th>regreso</th><th>estado</th><th>acciones</th></tr>";
  for (const viaje of VIAJES) {
    html += "<tr>";
    html += "<td>" + esc(viaje.id) + "</td>";
    html += "<td>" + esc(viaje.destino) + "</td>";
    html += "<td>" + esc(viaje.personas) + "</td>";
    html += "<td>" + esc(viaje.presupuesto) + "</td>";
    html += "<td>" + esc(viaje.fecha_salida) + "</td>";
    html += "<td>" + esc(viaje.fecha_regreso) + "</td>";
    html += "<td>" + esc(viaje.estado) + "</td>";
    html += "<td>";
    html += '<button class="chico" type="button" data-accion="ver-actividades" data-id="' + viaje.id + '">Actividades</button>';
    if (ROL === "encargado") {
      html += '<button class="chico" type="button" data-accion="editar-viaje" data-id="' + viaje.id + '">Editar</button>';
      html += '<button class="chico peligro" type="button" data-accion="borrar-viaje" data-id="' + viaje.id + '">Borrar</button>';
    }
    html += "</td>";
    html += "</tr>";
  }
  html += "</table>";
  $("#listaViajes").innerHTML = html;
}

function buscarViaje(id) {
  for (const viaje of VIAJES) {
    if (viaje.id === id) {
      return viaje;
    }
  }
  return null;
}

// Pone el formulario en modo "editar" con los datos del viaje
function empezarEdicionViaje(id) {
  const viaje = buscarViaje(id);
  if (viaje === null) {
    return;
  }
  VIAJE_EDITANDO = viaje;
  limpiarErrores("v", CAMPOS_VIAJE);
  for (const campo of CAMPOS_VIAJE) {
    $("#v_" + campo).value = viaje[campo];
  }
  $("#tViaje").textContent = "Editar viaje " + viaje.id + " (solo se mandan los campos que cambies)";
  $("#vGuardar").textContent = "Guardar cambios";
  $("#vCancelar").classList.remove("oculto");
  mensaje($("#vMsg"), "", "");
  $("#cViaje").scrollIntoView({ behavior: "smooth" });
}

// Regresa el formulario al modo "nuevo viaje"
function salirEdicionViaje() {
  VIAJE_EDITANDO = null;
  $("#fViaje").reset();
  limpiarErrores("v", CAMPOS_VIAJE);
  $("#tViaje").textContent = "Nuevo viaje";
  $("#vGuardar").textContent = "Guardar viaje";
  $("#vCancelar").classList.add("oculto");
}

$("#vCancelar").addEventListener("click", () => {
  salirEdicionViaje();
  mensaje($("#vMsg"), "", "");
});

$("#fViaje").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  limpiarErrores("v", CAMPOS_VIAJE);
  const valores = leerCampos("v", CAMPOS_VIAJE, NUMEROS_VIAJE);

  let metodo = "POST";
  let ruta = "/viajes";
  let cuerpo = valores;

  if (VIAJE_EDITANDO !== null) {
    // Editar: PATCH, y solo mandamos lo que cambió
    metodo = "PATCH";
    ruta = "/viajes/" + VIAJE_EDITANDO.id;
    cuerpo = soloCambios(valores, VIAJE_EDITANDO);
    if (Object.keys(cuerpo).length === 0) {
      mensaje($("#vMsg"), "aviso", "No cambiaste ningún campo.");
      return;
    }
  }

  $("#vGuardar").disabled = true;
  const { codigo, datos } = await pedir(metodo, ruta, cuerpo);
  $("#vGuardar").disabled = false;

  if (codigo === 200 || codigo === 201) {
    mensaje($("#vMsg"), "ok", "Guardado.");
    salirEdicionViaje();
    cargarViajes();
    return;
  }

  marcarErrores("v", datos);
  const [tipo, texto] = explicar(codigo, datos);
  mensaje($("#vMsg"), tipo, texto);
});

async function borrarViaje(id) {
  if (!confirm("¿Borrar el viaje " + id + " y todas sus actividades?")) {
    return;
  }
  const { codigo, datos } = await pedir("DELETE", "/viajes/" + id);
  if (codigo === 204) {
    if (VIAJE_ACTUAL === id) {
      VIAJE_ACTUAL = null;
      pintarSesion();
    }
    if (VIAJE_EDITANDO !== null && VIAJE_EDITANDO.id === id) {
      salirEdicionViaje();
    }
    mensaje($("#viajesMsg"), "ok", "Viaje borrado.");
    cargarViajes();
  } else {
    const [tipo, texto] = explicar(codigo, datos);
    mensaje($("#viajesMsg"), tipo, texto);
  }
}

$("#recargar").addEventListener("click", cargarViajes);

// ============================================================
// 7. ACTIVIDADES (del viaje que se eligió con el botón "Actividades")
// ============================================================

async function cargarActividades() {
  $("#listaActividades").innerHTML = '<span class="rueda"></span>Cargando…';
  const { codigo, datos } = await pedir("GET", "/viajes/" + VIAJE_ACTUAL + "/actividades");

  if (codigo !== 200 || !Array.isArray(datos)) {
    const [tipo, texto] = explicar(codigo, datos);
    $("#listaActividades").innerHTML = "";
    mensaje($("#aMsg"), tipo, texto);
    return;
  }

  ACTIVIDADES = datos;
  if (ACTIVIDADES.length === 0) {
    $("#listaActividades").innerHTML = "<p>No hay actividades todavía.</p>";
    return;
  }

  let html = "<table><tr><th>id</th><th>nombre</th><th>hora</th><th>creada por</th><th>acciones</th></tr>";
  for (const actividad of ACTIVIDADES) {
    html += "<tr>";
    html += "<td>" + esc(actividad.id) + "</td>";
    html += "<td>" + esc(actividad.nombre) + "</td>";
    html += "<td>" + esc(actividad.hora) + "</td>";
    html += "<td>" + esc(actividad.usuario) + "</td>";
    html += "<td>";
    html += '<button class="chico" type="button" data-accion="editar-actividad" data-id="' + actividad.id + '">Editar</button>';
    html += '<button class="chico peligro" type="button" data-accion="borrar-actividad" data-id="' + actividad.id + '">Borrar</button>';
    html += "</td>";
    html += "</tr>";
  }
  html += "</table>";
  $("#listaActividades").innerHTML = html;
}

function verActividades(viajeId) {
  VIAJE_ACTUAL = viajeId;
  salirEdicionActividad();
  mensaje($("#aMsg"), "", "");
  $("#tActividades").textContent = "Actividades del viaje " + viajeId;
  pintarSesion();
  cargarActividades();
  $("#cActividades").scrollIntoView({ behavior: "smooth" });
}

function buscarActividad(id) {
  for (const actividad of ACTIVIDADES) {
    if (actividad.id === id) {
      return actividad;
    }
  }
  return null;
}

function empezarEdicionActividad(id) {
  const actividad = buscarActividad(id);
  if (actividad === null) {
    return;
  }
  ACTIVIDAD_EDITANDO = actividad;
  limpiarErrores("a", CAMPOS_ACTIVIDAD);
  for (const campo of CAMPOS_ACTIVIDAD) {
    $("#a_" + campo).value = actividad[campo];
  }
  $("#aGuardar").textContent = "Guardar cambios";
  $("#aCancelar").classList.remove("oculto");
  mensaje($("#aMsg"), "", "");
}

function salirEdicionActividad() {
  ACTIVIDAD_EDITANDO = null;
  $("#fActividad").reset();
  limpiarErrores("a", CAMPOS_ACTIVIDAD);
  $("#aGuardar").textContent = "Guardar actividad";
  $("#aCancelar").classList.add("oculto");
}

$("#aCancelar").addEventListener("click", () => {
  salirEdicionActividad();
  mensaje($("#aMsg"), "", "");
});

$("#fActividad").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  limpiarErrores("a", CAMPOS_ACTIVIDAD);
  const valores = leerCampos("a", CAMPOS_ACTIVIDAD, []);

  let metodo = "POST";
  let ruta = "/viajes/" + VIAJE_ACTUAL + "/actividades";
  let cuerpo = valores;

  if (ACTIVIDAD_EDITANDO !== null) {
    // Editar: PATCH, y solo mandamos lo que cambió
    metodo = "PATCH";
    ruta = "/viajes/" + VIAJE_ACTUAL + "/actividades/" + ACTIVIDAD_EDITANDO.id;
    cuerpo = soloCambios(valores, ACTIVIDAD_EDITANDO);
    if (Object.keys(cuerpo).length === 0) {
      mensaje($("#aMsg"), "aviso", "No cambiaste ningún campo.");
      return;
    }
  }

  $("#aGuardar").disabled = true;
  const { codigo, datos } = await pedir(metodo, ruta, cuerpo);
  $("#aGuardar").disabled = false;

  if (codigo === 200 || codigo === 201) {
    mensaje($("#aMsg"), "ok", "Guardado.");
    salirEdicionActividad();
    cargarActividades();
    return;
  }

  marcarErrores("a", datos);
  const [tipo, texto] = explicar(codigo, datos);
  mensaje($("#aMsg"), tipo, texto);
});

async function borrarActividad(id) {
  if (!confirm("¿Borrar la actividad " + id + "?")) {
    return;
  }
  const { codigo, datos } = await pedir("DELETE", "/viajes/" + VIAJE_ACTUAL + "/actividades/" + id);
  if (codigo === 204) {
    if (ACTIVIDAD_EDITANDO !== null && ACTIVIDAD_EDITANDO.id === id) {
      salirEdicionActividad();
    }
    mensaje($("#aMsg"), "ok", "Actividad borrada.");
    cargarActividades();
  } else {
    const [tipo, texto] = explicar(codigo, datos);
    mensaje($("#aMsg"), tipo, texto);
  }
}

// ============================================================
// 8. LOS BOTONES DE LAS TABLAS
// ============================================================

document.addEventListener("click", (ev) => {
  const boton = ev.target.closest("button[data-accion]");
  if (!boton) {
    return;
  }
  const accion = boton.dataset.accion;
  const id = Number(boton.dataset.id);

  if (accion === "ver-actividades") {
    verActividades(id);
  } else if (accion === "editar-viaje") {
    empezarEdicionViaje(id);
  } else if (accion === "borrar-viaje") {
    borrarViaje(id);
  } else if (accion === "editar-actividad") {
    empezarEdicionActividad(id);
  } else if (accion === "borrar-actividad") {
    borrarActividad(id);
  }
});

// ============================================================
// 9. IA: rueda mientras espera, mensaje claro si falla
// ============================================================

$("#fIA").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  let destino = $("#iaTexto").value.trim();
  if (destino === "") {
    destino = "Comala, Colima";
  }

  $("#iaBtn").disabled = true;
  $("#iaRes").innerHTML = '<div class="msg aviso"><span class="rueda"></span>Preguntando a la IA…</div>';
  const { codigo, datos } = await pedir("POST", "/viajes/sugerencia", { destino: destino });
  $("#iaBtn").disabled = false;

  if (codigo === 200 && datos) {
    $("#iaRes").innerHTML = '<div class="chips"><span><b>tipo:</b> ' + esc(datos.tipo) + "</span>" +
                            "<span><b>sugerencia:</b> " + esc(datos.sugerencia) + "</span></div>";
  } else {
    const [tipo, texto] = explicar(codigo, datos);
    mensaje($("#iaRes"), tipo, texto);
  }
});

// ============================================================
// 10. AL ABRIR LA PÁGINA
// ============================================================

async function iniciar() {
  $("#info").textContent = "API: " + API + "  ·  esta página: " + location.origin;
  if (TOKEN !== null) {
    await cargarYo();        // si el token ya expiró, cargarYo cierra la sesión
  }
  pintarSesion();
  if (TOKEN !== null) {
    cargarViajes();
  }
}

iniciar();
</script>
